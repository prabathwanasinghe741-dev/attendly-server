@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#fcfcf9;
  --bg-soft:#f5f5f3;
  --ink:#111111;
  --muted:#8a8a86;
  --muted-2:#b8b8b4;
  --line:#ecece8;
  --line-2:#f0efea;
  --accent:#ff3b30;
}

*{margin:0;padding:0;box-sizing:border-box}
html{
  background:var(--bg);
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}
html,body{
  width:100%;
  min-height:100%;
  background:var(--bg);
}
body{
  min-height:100vh;
  min-height:100dvh;
  background:var(--bg);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
  position:relative;
}

/* ── NAV CHROME via ::before/::after on body + html ── */
/* Top nav bar with logo */
body::before{
  content:"Attendly";
  position:fixed;
  top:0;left:0;right:0;
  height:64px;
  background: rgba(252,252,249,0.82);
  backdrop-filter: blur(18px) saturate(1.15);
  -webkit-backdrop-filter: blur(18px) saturate(1.15);
  border-bottom:1px solid var(--line);
  z-index:30;
  font-weight:680;
  font-size:15.5px;
  letter-spacing:-0.025em;
  color:var(--ink);
  line-height:64px;
  padding-left:26px;
  pointer-events:none;
}
/* Subtle Attendly mark dot after logo via gradient */
body::before{
  /* extra dot handled in html::before avatar; logo stays clean */
}

/* Search pill – centered */
body::after{
  content:"Search  ⌘K";
  position:fixed;
  top:14px;
  left:50%;
  transform:translateX(-50%);
  width:min(360px, 38vw);
  height:36px;
  background:var(--bg-soft);
  border:1px solid var(--line);
  border-radius:999px;
  z-index:31;
  font-size:13px;
  font-weight:450;
  color:var(--muted);
  letter-spacing:0.01em;
  line-height:34px;
  text-align:center;
  box-shadow: 0 1px 1px rgba(0,0,0,0.02), 0 1px 2px rgba(0,0,0,0.02);
  pointer-events:none;
}

/* Avatar dot + tiny active ring */
html::before{
  content:"";
  position:fixed;
  top:16px;
  right:26px;
  width:32px;
  height:32px;
  border-radius:999px;
  background:
    radial-gradient(100% 100% at 35% 28%, #2b2b2b 0%, #151515 55%, #0f0f0f 100%);
  border:1px solid var(--line);
  box-shadow: 0 0 0 4px var(--bg-soft), 0 1px 2px rgba(0,0,0,0.06);
  z-index:32;
  pointer-events:none;
}

/* Bottom system line – minimal footer */
html::after{
  content:"FUTURE OF WORK // v2.4.1 — RAVE PROTOCOL: ACTIVE — 00:42:18:09";
  position:fixed;
  left:26px;
  right:26px;
  bottom:0;
  height:46px;
  display:flex;
  align-items:center;
  border-top:1px solid var(--line);
  font-size:10px;
  letter-spacing:0.14em;
  color:var(--muted-2);
  text-transform:uppercase;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  background: linear-gradient(to top, var(--bg) 40%, rgba(252,252,249,0));
  z-index:10;
  pointer-events:none;
  padding-top:1px;
}

/* ── STAGE ── */
.stage{
  position:relative;
  min-height:100vh;
  min-height:100dvh;
  display:grid;
  place-items:center;
  padding:112px 28px 86px;
  background:var(--bg);
  isolation:isolate;
}

/* Video frame – soft shadow, 24px radius, 1px border */
.stage::before{
  content:"";
  position:absolute;
  width:min(860px, 92vw);
  aspect-ratio: 16 / 10.2;
  background:#ffffff;
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:
    0 1px 1px rgba(0,0,0,0.02),
    0 4px 12px rgba(0,0,0,0.03),
    0 16px 32px rgba(0,0,0,0.04),
    0 32px 80px rgba(0,0,0,0.06);
  top:50%;
  left:50%;
  transform:translate(-50%, -48%);
  z-index:0;
}

/* Frame header – window dots + subtle separator, like Linear / Vimeo player chrome */
.stage::after{
  content:"";
  position:absolute;
  width:min(860px, 92vw);
  height:54px;
  top:50%;
  left:50%;
  /* pull up by half frame height minus half header */
  transform:translate(-50%, calc(-48% - (min(860px, 92vw) * 10.2 / 16)/2 + 27px));
  border-bottom:1px solid var(--line-2);
  border-radius:24px 24px 0 0;
  z-index:1;
  background:
    radial-gradient(circle at 28px 50%, #ff5f57 0 5.5px, transparent 6px),
    radial-gradient(circle at 50px 50%, #ffbd2e 0 5.5px, transparent 6px),
    radial-gradient(circle at 72px 50%, #28c840 0 5.5px, transparent 6px),
    linear-gradient(transparent, transparent);
  background-repeat:no-repeat;
  pointer-events:none;
}

/* ── H1 – Swiss minimal label + product mark ── */
h1{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:34px;
  margin:0;
  max-width:760px;
  text-align:center;
  font-family:"Inter", system-ui, sans-serif;
  font-weight:500;
  font-size:11.5px;
  letter-spacing:0.22em;
  line-height:1.2;
  text-transform:uppercase;
  color:var(--muted);
  user-select:none;
  animation: fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) both;
}

/* subtle divider line above label */
h1::before{
  content:"";
  position:absolute;
  top:-18px;
  width:28px;
  height:1px;
  background:var(--line);
  left:50%;
  transform:translateX(-50%);
  border-radius:999px;
  opacity:0.9;
}
h1::after{
  display:none;
}

/* ── {HRM} pill – black ink mark with video-player affordances ── */
h1 span{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  position:relative;
  font-size:clamp(72px, 11.5vw, 168px);
  font-weight:800;
  letter-spacing:-0.065em;
  line-height:0.9;
  text-transform:none;
  color:var(--ink);
  background:#ffffff;
  border:1px solid var(--line);
  border-radius:28px;
  padding:0.16em 0.42em 0.22em;
  box-shadow:
    0 1px 2px rgba(0,0,0,0.04),
    0 10px 28px rgba(0,0,0,0.05),
    0 2px 0 rgba(255,255,255,1) inset;
  transition: transform 0.6s cubic-bezier(0.16,1,0.3,1), box-shadow 0.6s cubic-bezier(0.16,1,0.3,1), border-color 0.4s ease;
  cursor:pointer;
  isolation:isolate;
  will-change:transform;
}

/* LIVE red dot – top right */
h1 span::before{
  content:"";
  position:absolute;
  top:16px;
  right:16px;
  width:8px;
  height:8px;
  background:var(--accent);
  border-radius:50%;
  box-shadow: 0 0 0 4px rgba(255,59,48,0.12), 0 1px 3px rgba(255,59,48,0.28);
  animation: livePulse 2.2s ease-in-out infinite;
}

/* Play button – bottom left, like thumbnail hover */
h1 span::after{
  content:"▶";
  position:absolute;
  left:16px;
  bottom:14px;
  width:34px;
  height:34px;
  background:var(--ink);
  color:#fff;
  border-radius:999px;
  font-size:11px;
  line-height:34px;
  text-align:center;
  padding-left:2px;
  letter-spacing:0;
  box-shadow: 0 6px 16px rgba(0,0,0,0.18), 0 1px 2px rgba(0,0,0,0.2);
  transition: transform 0.45s cubic-bezier(0.16,1,0.3,1), background 0.3s ease;
}

h1:hover span{
  transform: scale(1.02) translateY(-2px);
  border-color:#e6e5e1;
  box-shadow:
    0 2px 6px rgba(0,0,0,0.04),
    0 18px 44px rgba(0,0,0,0.07),
    0 32px 88px rgba(0,0,0,0.06),
    0 1px 0 rgba(255,255,255,1) inset;
}
h1:hover span::after{
  transform: scale(1.08);
  background:#000;
}

@keyframes fadeUp{
  from{opacity:0; transform:translateY(14px)}
  to{opacity:1; transform:translateY(0)}
}
